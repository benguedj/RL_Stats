ShortDescription: Automatic win / loss counter overlay for Rocket League.
Description: |-
  RL Stats shows your session wins, losses and win rate right above the boost meter in Rocket League,
  and updates by itself at the end of every online match. It uses the game's official Stats API:
  nothing is injected into the game. Also includes match summaries, history and progress, players
  met before, an OBS streamer mode and Discord status.
